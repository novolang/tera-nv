[package]
name        = "tera-nv"
version     = "0.1.0"
description = "The Tera and Jinja2 template language, sans-IO: a template parsed once and rendered many times, a set of templates the caller fills so that `extends` and `include` resolve without the engine ever opening a file, filters and tests as registries the caller extends, autoescaping on by default through html-nv's own escape, and errors that name the template, the line and the include chain that reached it."
license     = "Apache-2.0"

# `experimental` until a program outside this repository has rendered
# with the package.
stability   = "experimental"

# `core`: no function performs input or output. `{% extends %}` needs
# another template, so `TeraSet` holds templates by name in memory,
# `set_missing` lists the names that are referenced and absent, and the
# host reads them and adds them.
layer       = "core"

category    = "web"

tags        = ["tera", "jinja2", "template", "templating", "render", "autoescape", "inheritance", "filters", "sans-io"]
repository  = "https://github.com/novolang/tera-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.8.9"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "The Tera template language, without the filesystem"

[dependencies]
# html-nv supplies the escape and nothing else. `{{ x }}` in an
# autoescaped template is `htmlsafe.escape_attr`, the function html-nv's
# own writer uses, so a page built with both has one escaping rule.
# `terarender.escape` republishes it for a filter that produces markup.
html-nv = "^0.1.0"
